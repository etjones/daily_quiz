# Interest: word-problem templates that re-tell a math problem as a story.
# Blanks: add/sub/compare/mul/frac_add/frac_sub/dec_add/dec_sub/dec_mul {a} {b}; div/div_rem/dec_div
# {total} {a}; frac_of {total} {frac}; area/perimeter {l} {w}; volume {l} {w} {h}. The numbers and the
# answer come from the math generator; a template only supplies the story, so it must make
# sense for any whole numbers from 2 into the thousands. No digits, and only letters, spaces
# and . , ? ! ' : ; ( ) & - (Typst markup characters are refused). End with a question.
name = "Mario"
blurb = "Mario, Luigi, coins, mushrooms and stars"

[templates]
add = [
  "Mario collected {a} coins in one world and {b} coins in the next. How many coins did he collect in all?",
  "Luigi found {a} mushrooms. Then he found {b} more. How many mushrooms did Luigi find?",
  "Princess Peach has {a} stars. Toad gives her {b} more. How many stars does she have now?",
  "Yoshi ate {a} apples on Monday and {b} on Tuesday. How many apples did Yoshi eat?",
]
sub = [
  "Mario had {a} coins and spent {b} of them at Toad's shop. How many coins are left?",
  "Yoshi had {a} melons and ate {b} of them. How many melons are left?",
  "Luigi had {a} mushrooms and gave {b} of them to Peach. How many mushrooms does he have left?",
  "Toad baked {a} cookies for the castle and the guests ate {b}. How many cookies are left?",
]
compare = [
  "Mario has {a} coins and Luigi has {b} coins. How many more coins does Mario have?",
  "Peach found {a} stars and Daisy found {b}. How many more stars did Peach find?",
  "Yoshi ate {a} berries and Toad ate {b}. How many more berries did Yoshi eat?",
]
mul = [
  "Mario hits {a} blocks with {b} coins in each block. How many coins does he get?",
  "There are {a} trees with {b} apples on each tree for Yoshi. How many apples is that?",
  "Toad packs {a} boxes with {b} mushrooms in each box. How many mushrooms is that?",
]
div = [
  "Mario shares {total} coins equally among {a} friends. How many coins does each friend get?",
  "Peach puts {total} cupcakes equally on {a} plates. How many cupcakes go on each plate?",
  "Toad splits {total} mushrooms evenly into {a} baskets. How many mushrooms go in each basket?",
]
div_rem = [
  "Mario shares {total} coins equally among {a} friends. How many coins does each friend get, and how many are left over?",
  "Toad packs {total} mushrooms equally into {a} baskets. How many go in each basket, and how many are left over?",
]
frac_of = [
  "Luigi found {total} mushrooms, and {frac} of them were green. How many green mushrooms did he find?",
  "Peach has {total} stars, and {frac} of them came from Bowser's castle. How many stars came from the castle?",
]
frac_add = [
  "Peach baked {a} cakes on Monday and {b} cakes on Tuesday. How many cakes did she bake in all?",
  "Mario raced {a} miles on Rainbow Road and then {b} miles more. How many miles did he race?",
]
frac_sub = [
  "Toad had {a} pizzas, and Yoshi ate {b} pizzas. How many pizzas are left?",
  "Luigi's ghost hunt lasts {a} hours, and {b} hours have gone by. How many hours are left?",
]
dec_add = [
  "Yoshi ran {a} kilometers to the castle and {b} kilometers more to the beach. How many kilometers did he run?",
  "Mario's first kart lap took {a} seconds and his second took {b} seconds. How many seconds is that in all?",
]
dec_sub = [
  "Mario's kart had {a} liters of fuel and used {b} liters in the race. How many liters are left?",
  "Peach made {a} liters of lemonade, and the Toads drank {b} liters. How many liters are left?",
]
dec_mul = [
  "Mario races {a} laps that are each {b} kilometers long. How many kilometers does he race?",
  "Toad fills {a} jugs with {b} liters of juice in each. How many liters of juice is that?",
]
dec_div = [
  "Peach pours {total} liters of lemonade equally into {a} jugs. How many liters go in each jug?",
  "Daisy races {total} kilometers in {a} equal laps. How many kilometers long is each lap?",
]
area = [
  "A room in Peach's castle is {l} meters long and {w} meters wide. What is its area in square meters?",
  "Luigi's garden is {l} yards long and {w} yards wide. How many square yards is the garden?",
]
perimeter = [
  "Yoshi runs all the way around a field {l} meters long and {w} meters wide. How many meters does he run?",
  "Bowser's castle courtyard is {l} yards long and {w} yards wide. How many yards is it all the way around?",
]
volume = [
  "A treasure chest is {l} inches long, {w} inches wide and {h} inches tall. What is its volume in cubic inches?",
  "Toad's storage crate is {l} feet long, {w} feet wide and {h} feet tall. How many cubic feet does it hold?",
]
