# Interest: word-problem templates that re-tell a math problem as a story.
# Blanks: add/sub/compare/mul/frac_add/frac_sub/dec_add/dec_sub/dec_mul {a} {b}; div/div_rem/dec_div
# {total} {a}; frac_of {total} {frac}; area/perimeter {l} {w}; volume {l} {w} {h}. The numbers and the
# answer come from the math generator; a template only supplies the story, so it must make
# sense for any whole numbers from 2 into the thousands. No digits, and only letters, spaces
# and . , ? ! ' : ; ( ) & - (Typst markup characters are refused). End with a question.
name = "Football"
blurb = "Touchdowns, passes, helmets and game day"

[templates]
add = [
  "The Eagles scored {a} points this season before the break and {b} points after it. How many points did they score?",
  "Jamal threw {a} passes at practice on Monday and {b} on Tuesday. How many passes did he throw in all?",
  "A stadium sold {a} pretzels before the game and {b} more at halftime. How many pretzels were sold?",
  "Grace has {a} football cards. Her aunt gives her {b} more. How many cards does Grace have now?",
]
sub = [
  "The team had {a} footballs and lost {b} of them over the fence. How many footballs are left?",
  "There were {a} fans in the stadium. In the snow, {b} of them went home. How many fans stayed?",
  "The band had {a} paper pompoms and gave away {b} of them. How many pompoms are left?",
  "Ravi has {a} team stickers. He puts {b} of them on his helmet. How many stickers are left?",
]
compare = [
  "The Bulldogs have scored {a} points this year and the Jets have scored {b}. How many more points do the Bulldogs have?",
  "Emma ran {a} yards this season and Tariq ran {b} yards. How many more yards did Emma run?",
  "One stadium has {a} seats and another has {b}. How many more seats does the first stadium have?",
]
mul = [
  "The coach has {a} bins with {b} footballs in each bin. How many footballs is that?",
  "There are {a} teams in the league and each team sells {b} jerseys. How many jerseys are sold?",
  "The stadium has {a} rows of seats with {b} seats in each row. How many seats are there?",
]
div = [
  "The coach puts {total} footballs equally into {a} bins. How many footballs go in each bin?",
  "There are {total} kids at football camp, split evenly into {a} teams. How many kids are on each team?",
  "{total} fans fill {a} sections of the stadium equally. How many fans are in each section?",
]
div_rem = [
  "Coach Davis puts {total} footballs equally into {a} bins. How many footballs go in each bin, and how many are left over?",
  "{total} players split into {a} equal squads for drills. How many players are in each squad, and how many are left over?",
]
frac_of = [
  "The Eagles threw {total} passes, and {frac} of them went to Maria. How many passes went to Maria?",
  "A stadium has {total} seats, and {frac} of them are in the student section. How many seats are in the student section?",
]
frac_add = [
  "Jamal's team practiced for {a} hours on Friday and {b} hours on Saturday. How many hours did they practice?",
  "Fans ate {a} pans of nachos before kickoff and {b} pans at halftime. How many pans of nachos did they eat?",
]
frac_sub = [
  "The band had {a} pizzas after the halftime show and ate {b} pizzas. How many pizzas are left?",
  "A water cooler held {a} gallons at kickoff, and the players drank {b} gallons. How many gallons are left?",
]
dec_add = [
  "Emma's helmet weighs {a} pounds and her shoulder pads weigh {b} pounds. How many pounds is her gear in all?",
  "Tariq ran {a} miles on Monday and {b} miles on Wednesday. How many miles did he run altogether?",
]
dec_sub = [
  "The cooler had {a} liters of sports drink, and the team drank {b} liters. How many liters are left?",
  "The game clock read {a} minutes, and then {b} minutes ran off. How many minutes are left on the clock?",
]
dec_mul = [
  "The team runs {a} sprints that are each {b} meters long. How many meters do they run in all?",
  "The coach fills {a} coolers with {b} liters of water in each. How many liters of water is that?",
]
dec_div = [
  "The trainer shares {total} liters of ice water equally among {a} coolers. How many liters go in each cooler?",
  "Ravi runs {total} miles in {a} equal training runs. How many miles is each run?",
]
area = [
  "A football field is {l} yards long and {w} yards wide. What is its area in square yards?",
  "The team logo painted on the field is a rectangle {l} feet long and {w} feet wide. How many square feet does it cover?",
]
perimeter = [
  "Jamal jogs all the way around a field {l} yards long and {w} yards wide. How many yards does he jog?",
  "A locker room is {l} meters long and {w} meters wide. How many meters is it all the way around?",
]
volume = [
  "A crate of helmets is {l} feet long, {w} feet wide and {h} feet tall. What is its volume in cubic feet?",
  "A cooler is {l} inches long, {w} inches wide and {h} inches tall. How many cubic inches does it hold?",
]
