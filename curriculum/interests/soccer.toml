# Interest: word-problem templates that re-tell a math problem as a story.
# Blanks: add/sub/compare/mul/frac_add/frac_sub/dec_add/dec_sub/dec_mul {a} {b}; div/div_rem/dec_div
# {total} {a}; frac_of {total} {frac}; area/perimeter {l} {w}; volume {l} {w} {h}. The numbers and the
# answer come from the math generator; a template only supplies the story, so it must make
# sense for any whole numbers from 2 into the thousands. No digits, and only letters, spaces
# and . , ? ! ' : ; ( ) & - (Typst markup characters are refused). End with a question.
name = "Soccer"
blurb = "Goals, kicks, saves and cheering crowds"

[templates]
add = [
  "Lucia kicked {a} balls into the net on Monday and {b} on Tuesday. How many goals did she kick in all?",
  "The Lions scored {a} goals this year and {b} goals last year. How many goals is that altogether?",
  "There were {a} fans at the field. Then {b} more fans came. How many fans are there now?",
  "Noah juggled the ball {a} times in the morning and {b} times after lunch. How many times did he juggle it?",
]
sub = [
  "The club had {a} soccer balls and lost {b} in the woods. How many balls are left?",
  "There were {a} orange slices at the game. The players ate {b} of them. How many slices are left?",
  "A stadium had {a} fans. Before the end, {b} of them went home. How many fans stayed?",
  "Amara had {a} soccer stickers. She traded away {b} of them. How many stickers does she have left?",
]
compare = [
  "The Sharks have {a} goals this season and the Owls have {b}. How many more goals do the Sharks have?",
  "Diego made {a} saves in goal this year and Hana made {b}. How many more saves did Diego make?",
  "One stadium has {a} seats and another has {b}. How many more seats does the first stadium have?",
]
mul = [
  "The coach has {a} bags with {b} soccer balls in each bag. How many soccer balls is that?",
  "There are {a} teams at the tournament and each team brings {b} water bottles. How many water bottles are there?",
  "The stadium has {a} rows with {b} seats in each row. How many seats are there?",
]
div = [
  "The coach puts {total} soccer balls equally into {a} bags. How many balls go in each bag?",
  "There are {total} kids at soccer camp, split evenly into {a} teams. How many kids are on each team?",
  "{total} orange slices are shared equally among {a} teams. How many slices does each team get?",
]
div_rem = [
  "Coach Rivera puts {total} soccer balls equally into {a} bags. How many balls go in each bag, and how many are left over?",
  "The team shares {total} orange slices equally among {a} players. How many does each get, and how many are left over?",
]
frac_of = [
  "The Lions took {total} shots, and {frac} of them were goals. How many goals did they score?",
  "There are {total} fans at the field, and {frac} of them wear green. How many fans wear green?",
]
frac_add = [
  "Lucia ran {a} miles in the first half and {b} miles in the second half. How many miles did she run in the game?",
  "Noah's team ate {a} pizzas on Friday and {b} pizzas on Saturday. How many pizzas did they eat in all?",
]
frac_sub = [
  "The coach brought {a} gallons of water, and the team drank {b} gallons. How many gallons are left?",
  "Amara's tournament lasts {a} hours, and {b} hours have passed. How many hours are left?",
]
dec_add = [
  "Diego ran {a} kilometers in the first half and {b} kilometers in the second half. How many kilometers did he run?",
  "Hana kicked the ball {a} meters, then a teammate kicked it {b} meters farther. How many meters did it travel?",
]
dec_sub = [
  "The water cooler held {a} liters, and the players drank {b} liters. How many liters are left?",
  "The field needs {a} kilograms of grass seed, and Pablo has spread {b} kilograms. How many kilograms are left to spread?",
]
dec_mul = [
  "Each of {a} players drinks {b} liters of water at the game. How many liters do they drink in all?",
  "Lucia runs {b} kilometers at each of {a} practices. How many kilometers does she run in all?",
]
dec_div = [
  "The coach pours {total} liters of water equally into {a} bottles. How many liters go in each bottle?",
  "Noah runs {total} kilometers over {a} practices, the same each time. How many kilometers does he run at each one?",
]
area = [
  "A soccer field is {l} meters long and {w} meters wide. What is its area in square meters?",
  "The penalty area is a rectangle {l} yards long and {w} yards wide. How many square yards is it?",
]
perimeter = [
  "Diego jogs all the way around a field {l} meters long and {w} meters wide. How many meters does he jog?",
  "A practice field is {l} yards long and {w} yards wide. How many yards of chalk line go all the way around it?",
]
volume = [
  "A ball bin is {l} feet long, {w} feet wide and {h} feet tall. What is its volume in cubic feet?",
  "A box of shin guards is {l} inches long, {w} inches wide and {h} inches tall. How many cubic inches does it hold?",
]
