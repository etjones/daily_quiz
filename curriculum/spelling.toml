[[skill]]
id = "sp.adv.silent"
strand = "adv-vowels"
title = "Silent b, g and t (lamb, sign)"
prereqs = ["sp.other.wr"]
pattern = '(mb|gn|st(le|en))'
hl = '(?<=m)b|g(?=n)|(?<=s)t(?=le|en)'
tip = "Some letters are silent: b after m (lamb), g before n (sign), t in listen and castle."
words = ["lamb","sign","listen","thumb","gnat","castle","climb","design","comb","whistle","crumb","gnaw","fasten","limb","glisten"]

# --- affix-3 (grade 3) ---

[[skill]]
id = "sp.pre.dis"
strand = "affix-3"
hl = "^dis"
title = "Prefix dis- (dislike, disagree)"
prereqs = ["sp.morph.re"]
pattern = '^dis'
tip = "dis- means not, or the opposite of. Add it without changing the base word."
words = ["dislike","disagree","disappear","dishonest","disobey","distrust","discover","disconnect","displease","disloyal","disorder","disinfect","disable","disappoint"]

[[skill]]
id = "sp.pre.pre"
strand = "affix-3"
hl = "^pre"
title = "Prefix pre- (preview, preheat)"
prereqs = ["sp.pre.dis"]
pattern = '^pre'
tip = "pre- means before."
words = ["preview","preheat","prepay","preschool","pretest","precook","prewash","preset","prefix","preteen","prejudge","preorder"]

[[skill]]
id = "sp.pre.non"
strand = "affix-3"
hl = "^non"
title = "Prefix non- (nonstop, nonsense)"
prereqs = ["sp.pre.pre"]
pattern = '^non'
tip = "non- means not."
words = ["nonstop","nonsense","nonfiction","nonliving","nonfat","nonstick","nontoxic","nonslip","nonprofit","nonverbal","nonmetal","nonsmoking"]

[[skill]]
id = "sp.pre.in-not"
strand = "affix-3"
hl = "^(im|in)"
title = "Prefixes im- and in-, meaning not (impolite, incorrect)"
prereqs = ["sp.pre.non"]
pattern = '^(im|in)'
tip = "im- and in- can mean not. Use im- before b, m or p."
note = "TEKS also list im- meaning into (import); that sense is taught with the root port."
words = ["impolite","incorrect","impossible","incomplete","impatient","invisible","imperfect","inactive","improper","indirect","immobile","inexpensive","impure","insecure"]

[[skill]]
id = "sp.suf.ness"
strand = "affix-3"
hl = "ness$"
title = "Suffix -ness (kindness, darkness)"
prereqs = ["sp.morph.less", "sp.infl.ies"]
pattern = 'ness$'
tip = "-ness turns a describing word into a thing: kind, kindness. A final y changes to i: happiness."
words = ["kindness","darkness","sadness","goodness","softness","illness","sickness","weakness","happiness","thickness","loudness","laziness","emptiness","fitness"]

[[skill]]
id = "sp.suf.y"
strand = "affix-3"
hl = "y$"
title = "Suffix -y (sleepy, cloudy)"
prereqs = ["sp.suf.ness", "sp.infl.double", "sp.infl.drop-e"]
pattern = '^[a-z]{3,}y$'
tip = "-y means full of or like: cloud, cloudy. Drop a silent e (shiny); double after a short vowel (foggy)."
words = ["sleepy","cloudy","snowy","dusty","bumpy","stormy","noisy","shiny","foggy","muddy","salty","chilly","grassy","rocky","crunchy"]

[[skill]]
id = "sp.suf.y-to-i"
strand = "affix-3"
hl = 'i(?=(ly|ful)$)'
title = "y to i before -ly and -ful (happily, beautiful)"
prereqs = ["sp.suf.y", "sp.morph.ly", "sp.morph.ful"]
pattern = 'i(ly|ful)$'
tip = "Consonant plus y: change the y to i before adding -ly or -ful."
words = ["happily","easily","angrily","busily","luckily","heavily","beautiful","plentiful","pitiful","merciful","noisily","dutiful","readily","steadily"]

# --- homophones (grade 3) ---

[[skill]]
id = "sp.homo.2"
strand = "homophones"
title = "Homophones II (ate/eight, hole/whole)"
prereqs = ["sp.morph.homophone"]
pattern = '.'
needs_sentence = true
tip = "Same sound, different spelling. Listen to the sentence to choose."
note = "Pairs sit next to each other so both spellings are taught together. The parent script always reads the sentence."
words = ["ate","eight","buy","by","four","for","knew","new","hole","whole","week","weak","flower","flour","pair","pear"]
[skill.sentences]
ate = "I ate my lunch."
eight = "A spider has eight legs."
buy = "We buy milk at the store."
by = "Sit by me."
four = "A dog has four legs."
for = "This gift is for you."
knew = "I knew the answer."
new = "I have new shoes."
hole = "The dog dug a hole."
whole = "I ate the whole apple."
week = "There are seven days in a week."
weak = "I felt weak when I was sick."
flower = "A red flower grew in the yard."
flour = "We need flour to bake bread."
pair = "I have a pair of socks."
pear = "I ate a green pear."

# --- grade 4 ---

[[skill]]
id = "sp.adv.ough"
strand = "adv-vowels"
grade = 4
title = "ough, many sounds (rough, though)"
prereqs = ["sp.adv.ought"]
pattern = 'ough'
tip = "ough can say uff (rough), off (cough) or oh (though). Learn which word goes with which sound."
note = "No rule predicts the sound. Sort the words into sound groups: rough/tough/enough, cough/trough, though/dough/although, thorough."
words = ["rough","though","tough","dough","enough","cough","although","doughnut","roughly","thorough","trough","throughout"]

[[skill]]
id = "sp.pre.mis"
strand = "affix-4"
hl = "^mis"
title = "Prefix mis- (mistake, misspell)"
prereqs = ["sp.pre.in-not"]
pattern = '^mis'
tip = "mis- means wrongly. Keep every letter: mis + spell is misspell, with two s's."
words = ["mistake","misspell","misread","misplace","misuse","mislead","misbehave","misprint","misjudge","mismatch","misfit","mishear","misstep"]

[[skill]]
id = "sp.pre.sub"
strand = "affix-4"
hl = "^sub"
title = "Prefix sub- (subway, submarine)"
prereqs = ["sp.pre.mis"]
pattern = '^sub'
tip = "sub- means under or below."
words = ["subway","submarine","subtract","subtitle","subzero","subset","subtopic","subheading","submerge","subsoil","suburb","subdivide"]

[[skill]]
id = "sp.suf.ment"
strand = "affix-4"
hl = "ment$"
title = "Suffix -ment (payment, movement)"
prereqs = ["sp.suf.y-to-i"]
pattern = 'ment$'
tip = "-ment turns an action into a thing: pay, payment. Keep a silent e: move, movement."
note = "argument (argue) is the well-known exception that drops the e."
words = ["payment","movement","treatment","enjoyment","agreement","equipment","excitement","amazement","statement","pavement","shipment","basement","argument","government"]

[[skill]]
id = "sp.suf.able"
strand = "affix-4"
hl = "able$"
title = "Suffix -able (readable, washable)"
prereqs = ["sp.suf.ment"]
pattern = 'able$'
tip = "-able means can be. It usually goes on a whole word: wash, washable."
words = ["readable","washable","breakable","comfortable","enjoyable","dependable","remarkable","reasonable","lovable","believable","agreeable","adorable","valuable","avoidable"]

[[skill]]
id = "sp.suf.ible"
strand = "affix-4"
hl = "ible$"
title = "Suffix -ible (visible, possible)"
prereqs = ["sp.suf.able"]
pattern = 'ible$'
tip = "-ible sounds like -able. It usually goes on a part that is not a word by itself: vis, visible."
words = ["visible","possible","terrible","horrible","flexible","sensible","edible","responsible","incredible","reversible","legible","audible","convertible"]

[[skill]]
id = "sp.suf.ity"
strand = "affix-4"
hl = "ity$"
title = "Suffix -ity (activity, equality)"
prereqs = ["sp.suf.ible"]
pattern = 'ity$'
tip = "-ity turns a describing word into a thing: equal, equality. Drop a final e first (active, activity)."
words = ["activity","equality","ability","reality","electricity","curiosity","humidity","creativity","possibility","security","majority","popularity","publicity"]

[[skill]]
id = "sp.suf.tion"
strand = "affix-4"
hl = "tion$"
title = "-tion: the t changes sound (select, selection)"
prereqs = ["sp.suf.ment"]
pattern = 'tion$'
tip = "The base word ends in t. Keep the t and add -ion, even though it now says /sh/: select, selection."
words = ["selection","direction","protection","collection","connection","correction","action","invention","election","completion","attraction","subtraction","prediction","exception"]

[[skill]]
id = "sp.root.graph"
strand = "roots"
hl = "(auto|graph)"
title = "Roots auto and graph (autograph, paragraph)"
prereqs = ["sp.other.ph", "sp.syl.open"]
pattern = '(auto|graph)'
tip = "auto means self. graph means write or draw. graph is spelled with ph."
words = ["autograph","automatic","paragraph","automobile","graphic","biography","autopilot","calligraphy","autobiography","graphite","autocorrect","graphing"]

[[skill]]
id = "sp.root.meter"
strand = "roots"
hl = "(meter|tele)"
title = "Roots meter and tele (thermometer, telescope)"
prereqs = ["sp.root.graph"]
pattern = '(meter|tele)'
tip = "meter means measure. tele means far away."
words = ["thermometer","telescope","centimeter","television","perimeter","telegram","diameter","speedometer","kilometer","telecast","millimeter","barometer","odometer"]

[[skill]]
id = "sp.root.phon"
strand = "roots"
hl = "phon"
title = "Root phon, sound (telephone, microphone)"
prereqs = ["sp.root.meter"]
pattern = 'phon'
tip = "phon means sound. It is spelled with ph."
words = ["telephone","microphone","headphones","saxophone","symphony","xylophone","megaphone","earphone","homophone","phonograph","smartphone","phoneme"]

[[skill]]
id = "sp.root.port"
strand = "roots"
hl = "port"
title = "Root port, carry (portable, export)"
prereqs = ["sp.root.phon"]
pattern = 'port'
tip = "port means carry. export: carry out. import: carry in."
words = ["portable","export","import","report","support","airport","passport","porter","reporter","important","seaport","carport"]

[[skill]]
id = "sp.homo.3"
strand = "homophones"
grade = 4
title = "Homophones III (your/you're, whose/who's)"
prereqs = ["sp.homo.2", "sp.morph.contraction"]
pattern = '.'
needs_sentence = true
tip = "If you can say you are, it is or who is instead, use the apostrophe."
note = "Pairs sit next to each other. The parent script always reads the sentence."
words = ["you're","your","it's","its","who's","whose","weather","whether","threw","through","aloud","allowed","peace","piece","plain","plane"]
[skill.sentences]
"you're" = "You're my best friend."
your = "Is this your hat?"
"it's" = "It's raining outside."
its = "The bird flapped its wings."
"who's" = "Who's at the door?"
whose = "Whose coat is this?"
weather = "The weather is sunny today."
whether = "I can't decide whether to stay or go."
threw = "She threw the ball to me."
through = "We walked through the woods."
aloud = "Read the story aloud."
allowed = "Dogs are not allowed in the store."
peace = "The two kings made peace."
piece = "May I have a piece of cake?"
plain = "I like plain toast."
plane = "The plane flew over the clouds."

# --- grade 5 ---

[[skill]]
id = "sp.pre.trans"
strand = "affix-5"
hl = "^trans"
title = "Prefix trans- (transport, translate)"
prereqs = ["sp.pre.sub", "sp.root.port"]
pattern = '^trans'
tip = "trans- means across or change."
words = ["transport","translate","transform","transfer","transplant","transparent","transit","transmit","transaction","transcript","transportation","transcontinental"]

[[skill]]
id = "sp.pre.super"
strand = "affix-5"
hl = "^super"
title = "Prefix super- (superhero, supermarket)"
prereqs = ["sp.pre.trans"]
pattern = '^super'
tip = "super- means above, or more than usual."
words = ["superhero","supermarket","superstar","supervise","supersonic","superpower","supernatural","supervisor","superhuman","superstition","superb","supersize"]

[[skill]]
id = "sp.suf.ive"
strand = "affix-5"
hl = "ive$"
title = "Suffix -ive (active, creative)"
prereqs = ["sp.suf.tion"]
pattern = 'ive$'
tip = "-ive means tends to: create, creative. Drop a silent e before adding it."
words = ["active","creative","attractive","protective","expensive","massive","explosive","positive","negative","impressive","talkative","productive","effective","festive","defensive"]

[[skill]]
id = "sp.change.sion"
strand = "changes"
hl = "sion$"
title = "-sion: d and de change (decide, decision)"
prereqs = ["sp.suf.tion"]
pattern = 'sion$'
tip = "When the base word ends in d or de, the new word often ends in -sion: decide, decision."
note = "Base words: decide, divide, explode, invade, erode, conclude, collide, persuade, extend, expand, include, suspend, comprehend, provide, intrude."
words = ["decision","division","explosion","invasion","erosion","conclusion","collision","persuasion","extension","expansion","inclusion","suspension","comprehension","provision","intrusion"]

[[skill]]
id = "sp.change.cian"
strand = "changes"
hl = "cian$"
title = "-cian: the c changes sound (music, musician)"
prereqs = ["sp.change.sion"]
pattern = 'cian$'
tip = "A person who does something with a word ending in c often ends in -cian: music, musician. Keep the c."
words = ["musician","magician","electrician","physician","politician","technician","mathematician","optician","beautician","pediatrician","statistician"]

[[skill]]
id = "sp.change.vowel"
strand = "changes"
title = "Vowel changes (crime, criminal)"
prereqs = ["sp.change.cian"]
pattern = '^[a-z]+$'
tip = "Think of the shorter word it comes from. The vowel letter stays even when its sound changes."
note = "Base words to say if the child is stuck: crime, nature, please, wise, heal, sign, mine, nation, athlete, volcano, sane, cave, compete, define."
words = ["criminal","natural","pleasant","wisdom","health","signal","mineral","national","athletic","volcanic","sanity","cavity","competition","definition"]

