[[skill]]
id = "sp.vt.ea-short"
strand = "vowel-team"
title = "ea, short e (bread, head)"
prereqs = ["sp.vt.wh"]
pattern = 'ea'
tip = "ea can also say short e, as in bread."
note = "Contrast with sp.vt.ea-long. Child must remember which words use which sound."
words = ["bread","head","dead","thread","sweat","spread","breath","wealth","ready","heavy","feather","weather"]

# --- r-controlled ---

[[skill]]
id = "sp.r.ar"
strand = "r-controlled"
title = "ar (car, farm)"
prereqs = ["sp.vt.ea-short"]
pattern = 'ar'
tip = "The sound in car is spelled ar."
words = ["car","star","farm","barn","yard","park","dark","shark","card","hard","march","start","sharp","smart"]

[[skill]]
id = "sp.r.or"
strand = "r-controlled"
title = "or (for, horn)"
prereqs = ["sp.r.ar"]
pattern = 'or'
tip = "The sound in for is spelled or."
words = ["for","horn","corn","fork","storm","short","sport","born","north","torn","porch","cord","sort"]

[[skill]]
id = "sp.r.er"
strand = "r-controlled"
title = "er (her, sister)"
prereqs = ["sp.r.or"]
pattern = 'er'
tip = "The sound at the end of sister is spelled er."
note = "er is the most common spelling of this sound. Teach it first, then ir and ur."
words = ["her","fern","jerk","herd","term","perch","sister","under","after","never","over","paper","letter","dinner","winter"]

[[skill]]
id = "sp.r.ir"
strand = "r-controlled"
title = "ir (bird, girl)"
prereqs = ["sp.r.er"]
pattern = 'ir'
tip = "The same sound as her can be spelled ir."
words = ["bird","girl","first","shirt","dirt","stir","skirt","third","thirst","chirp","swirl","fir","birth","twirl"]

[[skill]]
id = "sp.r.ur"
strand = "r-controlled"
title = "ur (burn, turn)"
prereqs = ["sp.r.ir"]
pattern = 'ur'
tip = "The same sound as her can also be spelled ur."
words = ["burn","turn","fur","hurt","nurse","curl","surf","curb","burst","church","purse","blur","spur"]

# --- other-patterns ---

[[skill]]
id = "sp.other.tch"
strand = "other-patterns"
title = "tch (catch, pitch)"
prereqs = ["sp.r.ur"]
pattern = 'tch$'
tip = "After a short vowel, the sound /ch/ at the end is spelled tch."
words = ["catch","match","patch","hatch","pitch","witch","fetch","stitch","ditch","batch","latch","scratch","itch","switch"]

[[skill]]
id = "sp.other.dge"
strand = "other-patterns"
title = "dge (bridge, badge)"
prereqs = ["sp.other.tch"]
pattern = 'dge$'
tip = "After a short vowel, the sound /j/ at the end is spelled dge."
words = ["bridge","badge","edge","fudge","ridge","judge","hedge","dodge","lodge","smudge","wedge","pledge","budge"]

[[skill]]
id = "sp.other.kn"
strand = "other-patterns"
title = "kn (knee, knot)"
prereqs = ["sp.other.dge"]
pattern = '^kn'
tip = "The k is silent. Say n, write kn."
words = ["knee","knit","know","knot","knock","knife","kneel","knew","knob","knack","knight"]

[[skill]]
id = "sp.other.wr"
strand = "other-patterns"
title = "wr (write, wrap)"
prereqs = ["sp.other.kn"]
pattern = '^wr'
tip = "The w is silent. Say r, write wr."
words = ["write","wrap","wrong","wrist","wreck","wren","wrote","wrench","wreath","wrinkle"]

[[skill]]
id = "sp.other.ph"
strand = "other-patterns"
title = "ph (phone, photo)"
prereqs = ["sp.other.wr"]
pattern = 'ph'
tip = "ph says /f/ in these words."
words = ["phone","photo","graph","alphabet","dolphin","elephant","phonics","orphan","trophy","nephew"]

[[skill]]
id = "sp.other.soft-c"
strand = "other-patterns"
title = "Soft c (city, nice)"
prereqs = ["sp.other.ph"]
pattern = 'c[eiy]'
tip = "c says /s/ when e, i or y comes right after it."
words = ["city","cent","ice","nice","rice","mice","dance","fence","pencil","circle","circus","cell","space","place"]

[[skill]]
id = "sp.other.soft-g"
strand = "other-patterns"
title = "Soft g (gem, giant)"
prereqs = ["sp.other.soft-c"]
pattern = 'g[eiy]'
tip = "g can say /j/ when e, i or y comes right after it."
words = ["gem","giant","giraffe","gentle","germ","cage","ginger","magic","gym","stage","large","orange","change","engine"]

# --- y-and-le ---

[[skill]]
id = "sp.y.long-e"
strand = "y-and-le"
title = "y = long e (happy, baby)"
prereqs = ["sp.other.soft-g"]
pattern = 'y$'
tip = "At the end of a word with more than one syllable, y says long e."
words = ["happy","baby","puppy","funny","sunny","lucky","candy","story","family","bunny","silly","windy","rainy","messy"]

[[skill]]
id = "sp.y.long-i"
strand = "y-and-le"
title = "y = long i (my, fly)"
prereqs = ["sp.y.long-e"]
pattern = 'y$'
tip = "At the end of a short word, y can say long i."
words = ["my","by","fly","try","sky","cry","dry","why","shy","spy","fry","sly"]

[[skill]]
id = "sp.y.le"
strand = "y-and-le"
title = "-le (table, little)"
prereqs = ["sp.y.long-i"]
pattern = 'le$'
tip = "The ending sound /ul/ is often spelled le."
words = ["table","little","apple","candle","puzzle","bubble","giggle","middle","purple","turtle","simple","bottle","eagle","jungle"]

# --- inflection ---

[[skill]]
id = "sp.infl.s"
strand = "inflection"
title = "Plural -s (cats, dogs)"
prereqs = ["sp.cvc.mixed"]
pattern = 's$'
tip = "More than one: add s."
words = ["cats","dogs","hats","pigs","cups","bugs","frogs","hens","beds","books","trees","birds","tops","pens"]

[[skill]]
id = "sp.infl.es"
strand = "inflection"
title = "Plural -es (boxes, dishes)"
prereqs = ["sp.infl.s", "sp.digraph.sh", "sp.digraph.ch"]
pattern = 'es$'
tip = "If the word ends in s, x, z, ch or sh, add es."
words = ["boxes","dishes","wishes","buses","glasses","foxes","churches","brushes","lunches","kisses","watches","classes","bushes","peaches"]

[[skill]]
id = "sp.infl.ed"
strand = "inflection"
title = "-ed (jumped, played)"
prereqs = ["sp.infl.es"]
pattern = 'ed$'
tip = "Something that already happened: add ed, even when it sounds like t or d."
words = ["jumped","played","wanted","helped","looked","started","painted","pulled","asked","walked","cooked","called","climbed","filled"]

[[skill]]
id = "sp.infl.ing"
strand = "inflection"
title = "-ing (jumping, reading)"
prereqs = ["sp.infl.ed"]
pattern = 'ing$'
tip = "Something happening now: add ing."
words = ["jumping","playing","helping","looking","eating","going","reading","singing","walking","asking","cooking","calling","painting","starting"]

[[skill]]
id = "sp.infl.double"
strand = "inflection"
title = "Doubling the last letter (hopping, stopped)"
prereqs = ["sp.infl.ing"]
pattern = '(.)\1(ed|ing)$'
tip = "Short vowel plus one consonant: double the consonant before ing or ed."
words = ["hopping","running","sitting","stopped","clapped","swimming","digging","hugged","planned","dropped","zipped","skipped","getting","patted"]

[[skill]]
id = "sp.infl.drop-e"
strand = "inflection"
title = "Dropping the e (making, liked)"
prereqs = ["sp.infl.double", "sp.silent-e.mixed"]
pattern = '(ing|ed)$'
tip = "If the word ends in silent e, drop the e before ing or ed."
words = ["making","taking","hiking","riding","biking","baking","hoping","smiling","liked","lived","named","moved","shared","writing"]

[[skill]]
id = "sp.infl.ies"
strand = "inflection"
title = "y to ies (babies, puppies)"
prereqs = ["sp.infl.drop-e", "sp.y.long-e"]
pattern = 'ies$'
tip = "Consonant plus y: change the y to i and add es."
words = ["babies","puppies","flies","cities","stories","families","candies","bunnies","ponies","cries","tries","berries"]

[[skill]]
id = "sp.infl.irregular"
strand = "inflection"
title = "Irregular plurals (children, feet)"
prereqs = ["sp.infl.ies"]
pattern = '.'
tip = "Some words change in a special way. You just have to remember them."
note = "Memorised by form; no rule helps. Keep it to this small set."
words = ["children","men","women","feet","teeth","mice","geese","leaves","wolves","knives","shelves","loaves"]

# --- morphology ---

[[skill]]
id = "sp.morph.contraction"
strand = "morphology"
title = "Contractions (can't, it's)"
prereqs = ["sp.infl.ing"]
pattern = "'"
tip = "An apostrophe takes the place of the letters that are left out."
words = ["can't","don't","isn't","didn't","it's","I'm","we're","they're","I'll","let's","that's","he's","she's","won't"]

[[skill]]
id = "sp.morph.compound"
strand = "morphology"
title = "Compound words (sunshine, cupcake)"
prereqs = ["sp.silent-e.mixed", "sp.vt.ai"]
pattern = '^[a-z]{7,}$'
tip = "Two small words stuck together make one big word."
words = ["sunshine","cupcake","airplane","football","playground","rainbow","bedroom","backpack","popcorn","sidewalk","butterfly","birthday","homework","snowman"]

[[skill]]
id = "sp.morph.un"
strand = "morphology"
title = "Prefix un- (unhappy, unlock)"
prereqs = ["sp.y.long-e"]
pattern = '^un'
tip = "un- means not, or do the opposite."
words = ["unhappy","unlock","undo","unfair","unfold","unpack","untie","unsafe","unkind","unwrap","unfit","unlike"]

[[skill]]
id = "sp.morph.re"
strand = "morphology"
title = "Prefix re- (redo, replay)"
prereqs = ["sp.morph.un"]
pattern = '^re'
tip = "re- means again."
words = ["redo","replay","rewrite","reread","rebuild","refill","reuse","recall","retell","repack","rewind","restart"]

[[skill]]
id = "sp.morph.ful"
strand = "morphology"
title = "Suffix -ful (helpful, careful)"
prereqs = ["sp.infl.ing"]
pattern = 'ful$'
tip = "-ful means full of. It has one l."
note = "The suffix -ful has one l even though the word 'full' has two. Common error."
words = ["helpful","careful","painful","joyful","thankful","hopeful","playful","useful","colorful","wonderful"]

[[skill]]
id = "sp.morph.less"
strand = "morphology"
title = "Suffix -less (helpless, hopeless)"
prereqs = ["sp.morph.ful"]
pattern = 'less$'
tip = "-less means without."
words = ["helpless","hopeless","homeless","careless","useless","endless","painless","fearless","harmless"]

[[skill]]
id = "sp.morph.er-est"
strand = "morphology"
title = "-er and -est (taller, biggest)"
prereqs = ["sp.infl.double", "sp.infl.drop-e"]
pattern = '(er|est)$'
tip = "-er compares two. -est compares three or more."
words = ["taller","tallest","bigger","biggest","faster","fastest","smaller","smallest","happier","happiest","longer","longest"]

[[skill]]
id = "sp.morph.ly"
strand = "morphology"
title = "Suffix -ly (quickly, slowly)"
prereqs = ["sp.morph.less"]
pattern = 'ly$'
tip = "-ly tells how something is done."
words = ["quickly","slowly","sadly","gladly","loudly","softly","nicely","badly","kindly","quietly","lastly","neatly"]

[[skill]]
id = "sp.morph.homophone"
strand = "morphology"
title = "Homophones (here/hear, no/know)"
prereqs = ["sp.other.kn", "sp.vt.ea-long", "sp.other.wr"]
pattern = '.'
needs_sentence = true
tip = "Same sound, different spelling. The meaning tells you which one to write."
note = "These words can only be tested in a sentence. The parent script always reads the sentence."
words = ["here","hear","no","know","one","won","to","too","two","there","their","write","right","sea"]
[skill.sentences]
here = "Come here, please."
hear = "I can hear a bird."
no = "No, thank you."
know = "I know the answer."
one = "I have one cat."
won = "Our team won the game."
to = "We walked to school."
too = "I want to come too."
two = "She has two dogs."
there = "Put the book over there."
their = "The kids put on their coats."
write = "Please write your name."
right = "Turn right at the corner."
sea = "The sea is blue."

