[skill.sentences]
here = "Come here, please."
hear = "I can hear a bird."
no = "No, thank you."
know = "I know the answer."
one = "I have one cat."
won = "Our team won the game."
to = "We walked to school."
too = "I want to come too."
two = "She has two dogs."
there = "Put the book over there."
their = "The kids put on their coats."
write = "Please write your name."
right = "Turn right at the corner."
sea = "The sea is blue."

# --- syllables (grade 3) ---

[[skill]]
id = "sp.syl.vccv"
strand = "syllables"
title = "Syllable division VCCV (rabbit, napkin)"
prereqs = ["sp.y.le", "sp.infl.double"]
pattern = '[aeiou][bcdfghjklmnpqrstvwxz]{2}[aeiou]'
tip = "Two consonants between two vowels: split between them, rab | bit, nap | kin."
note = "Doubled and different consonants are mixed on purpose. With a double, both halves keep a letter."
words = ["rabbit","napkin","basket","kitten","muffin","picnic","button","dentist","tennis","magnet","insect","helmet","goblin","cactus","contest","sudden"]

[[skill]]
id = "sp.syl.open"
strand = "syllables"
title = "Open syllables (tiger, robot)"
prereqs = ["sp.syl.vccv"]
pattern = '^[bcdfghjklmnpqrstvwxyz]*[aeiou][bcdfghjklmnpqrstvwxz][aeiou]'
tip = "When the first vowel says its name, the syllable ends with that vowel: ti | ger, ro | bot."
words = ["tiger","robot","music","open","pilot","silent","frozen","student","human","label","spider","bacon","moment","hotel","total","focus"]

[[skill]]
id = "sp.syl.closed-vcv"
strand = "syllables"
title = "Closed first syllable, one consonant (cabin, lemon)"
prereqs = ["sp.syl.open"]
pattern = '^[bcdfghjklmnpqrstvwxyz]*[aeiou][bcdfghjklmnpqrstvwxz][aeiou]'
tip = "When the first vowel is short, the consonant stays with it: cab | in, lem | on. Write only one."
note = "Contrast with sp.syl.open (ti | ger). Children who have just learned doubling often write cabbin; that is the error this skill targets."
words = ["cabin","lemon","river","seven","planet","robin","wagon","comic","visit","model","habit","salad","finish","limit","metal"]

[[skill]]
id = "sp.syl.vcccv"
strand = "syllables"
title = "Three consonants in the middle (hundred, monster)"
prereqs = ["sp.syl.vccv"]
pattern = '[aeiou][bcdfghjklmnpqrstvwxz]{3}[aeiou]'
tip = "Three consonants in the middle: one or two go with each syllable. Clap it: hun | dred, mon | ster."
words = ["hundred","monster","pumpkin","sandwich","hamster","complete","instant","explain","address","control","athlete","kingdom","lobster","pilgrim","mushroom"]

[[skill]]
id = "sp.syl.r"
strand = "syllables"
title = "R-controlled in two syllables (garden, corner)"
prereqs = ["sp.syl.vccv", "sp.r.ur"]
pattern = '(ar|er|ir|or|ur)'
tip = "Split the word, then spell the ar, or, er, ir or ur part in each syllable."
words = ["garden","market","corner","morning","perfect","thirsty","turkey","harvest","partner","person","carpet","artist","curtain","forty","dirty"]

