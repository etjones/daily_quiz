words = ["pie","tie","lie","die","fried","tried","chief","field","thief","brief","shield","yield","piece","niece"]

[[skill]]
id = "sp.vt.oo-moon"
strand = "vowel-team"
title = "oo, as in moon (food, cool)"
prereqs = ["sp.vt.ie"]
pattern = 'oo'
tip = "The long oo sound, as in moon, is spelled oo."
words = ["moon","food","cool","pool","room","zoo","tooth","spoon","boot","soon","roof","broom","school","noon"]

[[skill]]
id = "sp.vt.oo-foot"
strand = "vowel-team"
title = "oo, as in book (look, good)"
prereqs = ["sp.vt.oo-moon"]
pattern = 'oo'
