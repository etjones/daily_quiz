# Spelling curriculum — Texas-aligned scope and sequence (draft v0.1)
#
# Structure
#   [meta]      file-level information
#   [[strand]]  a family of related skills; carries the adult-facing rationale
#   [[skill]]   one atomic, testable pattern; carries a word pool
#
# Word pools: the first `core` words (default 10, or all if fewer) are TAUGHT, in order.
# Words after `core` are TRANSFER words: unseen words with the same pattern, used later
# as "can you apply the pattern?" checks. Every word must match the skill's `pattern`
# regex (enforced by `dq validate`).
#
# Sources / honesty note: the sequence spans kindergarten through grade 5. K–2 follows
# the TEKS foundational-skills phonics list (VC/CVC/CCVC words; consonant blends;
# digraphs ch/tch/sh/th/wh/ng/ck/kn/-dge/ph; vowel digraphs oo, ea, ee, ow, ou, ay, ai,
# aw, au, ew, oa, ie, -igh; diphthongs oy/oi/ou/ow) plus the TEKS spelling expectations
# (sound-spelling patterns, inflections, high-frequency words from a research-based
# list). Grades 3–5 follow the spelling and vocabulary strands as I understand them:
# syllable division, homophones, the affixes and Greek/Latin roots the TEKS name as
# examples, and consonant/vowel changes between related words (select/selection,
# decide/decision, crime/criminal). Grade bands, word choices and the exact ordering are
# my own judgement of a common scope and sequence, not TEA text, and the TEKS paragraph
# numbers in `teks` fields are best-effort. Sight-word lists follow the Fry list order
# (words 1–300, proper nouns left out). Verify before relying on any of it.
#
# Each skill's `grade` (0 = kindergarten; inherited from its strand unless set on the
# skill) seeds placement, which trusts grades to be non-decreasing along each track. So a
# few TEKS grade-1 skills that sit after grade-2 skills in file order (plural -s through
# -ing, contractions, compounds) are marked grade 2.

[meta]
subject = "spelling"
version = "0.2"
teks_ref = "ELAR §110.2 (K) through §110.7 (grade 5), (b)(2) foundational language skills: spelling by sound-spelling patterns, syllable types, affixes and roots; high-frequency words; (b)(3) vocabulary: affixes and Greek/Latin roots"
teks_numbering_verified = false

# ---------------------------------------------------------------------------
# STRANDS
# ---------------------------------------------------------------------------

[[strand]]
id = "vc"
title = "Two-letter VC words"
track = "phonics"
grade = 0
teks = "§110.2(b)(2)(C)(i)"
rationale = "Kindergarten spelling starts with the shortest real words: one vowel, one consonant. Writing them shows the child that each sound gets a letter, in order, before a third sound is added."
teach = "Say the word and stretch it (a-t). The child says each sound while writing its letter. Keep it small: two or three words a day is plenty at this age."
watch_for = "Leaving out the vowel (t for at): a vowel at the start of a word is easy to miss. Say the first sound with exaggeration. Letter reversals are normal in kindergarten."

[[strand]]
id = "cvc"
title = "Short vowels in CVC words"
track = "phonics"
grade = 0
teks = "§110.2(b)(2)(C)(i); §110.3(b)(2)(C)(i)"
rationale = "Every later pattern is a variation on consonant-vowel-consonant. Short vowels first because each letter has one dependable sound and children can segment these words by ear."
teach = "Say the word slowly, stretching it (c-a-t). Child taps one finger per sound, then writes one letter per tap."
watch_for = "Short e and i get confused (pin/pen): the sounds are close in many accents. Reversed b/d and p/q are normal at this age; record them but do not scold."

[[strand]]
id = "digraph"
title = "Consonant digraphs and -ng/-nk"
track = "phonics"
grade = 1
rationale = "Two letters, one sound. Children who have not met digraphs will spell 'ship' as 'sip'. These are among the most common errors on first-grade writing."
teach = "Show that sh/ch/th/ck are one sound, not two. Have the child say the sound, then write the pair as a single unit."
watch_for = "ck vs k (duck written 'duk'). Rule of thumb: ck follows a short vowel at the end of a one-syllable word."

[[strand]]
id = "blend"
title = "Consonant blends"
track = "phonics"
grade = 1
rationale = "Blends keep both consonant sounds (unlike digraphs). Children usually drop the second letter (stop -> sop, jump -> jup). Final blends are where most first-grade spelling errors live."
teach = "Segment aloud and count the sounds: s-t-o-p is four sounds, so four letters. Contrast with digraphs: sh-o-p is three sounds."
watch_for = "Dropped letters in the middle of a word, especially a nasal before a consonant (lamp -> lap, tent -> tet). Nasals are hard to hear; say them with exaggeration."

[[strand]]
id = "silent-e"
title = "Silent-e long vowels"
track = "phonics"
grade = 1
rationale = "The first spelling pattern where a letter you cannot hear changes another letter. It is the gateway to long vowels."
teach = "Contrast pairs on paper: cap/cape, kit/kite, hop/hope, cub/cube. Cover the e and the vowel says its short sound."
watch_for = "Leaving the e off (mak) or writing long vowels with the letter name only (mak for make, bik for bike). Both come from spelling by letter names."

[[strand]]
id = "vowel-team"
title = "Vowel teams and diphthongs"
track = "phonics"
grade = 1
rationale = "English spells most long vowels with a team of two letters. Teaching each team separately, with its own word set, prevents the guess-and-check habit (rain/rane/rayn)."
teach = "Teach one team per day. Sort words by team. For ai/ay and oa/ow, teach position: ai and oa sit in the middle, ay and ow sit at the end."
watch_for = "Choosing the wrong team for the right sound (rane for rain). That is a good error: it shows the child hears the sound. It just needs the pattern, so do not mark it as careless."

[[strand]]
id = "r-controlled"
title = "R-controlled vowels"
track = "phonics"
grade = 1
rationale = "A vowel followed by r changes sound. ar and or are reliable. er, ir and ur all say the same sound, so those three must be memorised word by word."
teach = "Teach ar and or first. Teach er/ir/ur as three separate spellings of one sound, with a small set of words each."
watch_for = "er/ir/ur are interchangeable by ear, so a child who writes 'berd' for bird has done nothing wrong phonetically. Count it as a pattern error, not a careless one."

[[strand]]
id = "other-patterns"
title = "Other common patterns"
track = "phonics"
grade = 2
rationale = "Letter patterns that stand for sounds you cannot predict by ear: tch, -dge, silent kn and wr, ph = /f/, soft c and g."
teach = "Teach a rule where one exists: tch/dge come right after a short vowel, soft c/g come before e, i or y."
watch_for = "Writing the sound instead of the pattern (cach for catch, bij for bridge)."

[[strand]]
id = "y-and-le"
title = "Vowel y and -le endings"
track = "phonics"
grade = 2
rationale = "y acts as a vowel at the end of words, and -le is the most common final syllable pattern in two-syllable words."
teach = "Say the ending sound, then write it. Put the long-e y words and the long-i y words in separate piles."
watch_for = "Spelling the end of 'happy' as -ee or -ie (happee). The sound is right, the pattern is not."

[[strand]]
id = "inflection"
title = "Plurals and word endings"
track = "phonics"
grade = 2
rationale = "Adding -s, -es, -ed and -ing changes a word's meaning. The rules (doubling, dropping the e, y to i) turn up in nearly all writing."
teach = "Always start from the base word. Ask: does it end in a short vowel plus one consonant (double it)? A silent e (drop it)? A y (change it)?"
watch_for = "-ed is spoken as /t/, /d/ or /id/ but always written -ed. Children write 'jumpt', which is phonetically right, so treat it as a pattern error."

[[strand]]
id = "morphology"
title = "Contractions, compounds, prefixes and suffixes"
track = "phonics"
grade = 2
rationale = "The TEKS add morphology (word parts) as a spelling tool. Children who see words as parts can spell long words they have never met."
teach = "Show the parts with a gap (un | happy, sun | shine), then close the gap. For contractions, point at the missing letters."
watch_for = "Apostrophe placement in contractions (do'nt). Doubling the letter at a prefix join: un + necessary is the rare exception, un + lock is not."

[[strand]]
id = "sight-k"
title = "High-frequency words, first 20 (kindergarten)"
track = "sight"
grade = 0
teks = "§110.2(b)(2)(C)(iii)"
rationale = "The TEKS ask kindergartners to spell some high-frequency words. The first 20 Fry words are short and turn up in nearly every sentence a child writes."
teach = "Look, say, cover, write, check. One or two words a day. Say which letter is the surprise (the o in of, the a in was)."
watch_for = "Spelling the, of, was and they the way they sound (thu, uv, wuz, thay). That is normal at this age; these are learned by memory."

[[strand]]
id = "sight"
title = "High-frequency words (Fry list, in order)"
track = "sight"
grade = 1
teks = "§110.3(b)(2)(C)(iv); §110.4(b)(2)(C)(v); §110.5(b)(2)(B)"
rationale = "The first 100 Fry words make up about half of everything children read and write, and the first 300 about two-thirds. Many break the usual patterns (said, was, of, thought, eyes), so they must be learned as whole words."
teach = "Look, say, cover, write, check. Spell it aloud once, then write it from memory. Say which part is the tricky part."
watch_for = "Phonetic spellings of irregular words (sed for said, wuz for was). The child hears it correctly and has not yet memorised the exception."

[[strand]]
id = "syllables"
title = "Syllable division in longer words"
track = "phonics"
grade = 3
teks = "§110.5(b)(2)(A)(v); §110.5(b)(2)(B)(i)"
rationale = "From third grade on, most new spelling words have two or more syllables. Splitting a word into syllables turns one hard word into two easy ones, and the syllable type (closed or open) tells you whether the vowel is short or long."
teach = "Clap the syllables. Write each syllable as its own small word, then join them. Find the vowels first, then look at the consonants between them: rab|bit, ti|ger, cab|in."
watch_for = "Dropping one of a double consonant (rabit, kiten) or doubling where there should be one (tigger). Both are syllable-type errors: ask whether the first vowel is short or long."

[[strand]]
id = "adv-vowels"
title = "Harder vowel and silent-letter patterns"
track = "phonics"
grade = 3
teks = "§110.5(b)(2)(B)(iii); §110.6(b)(2)(B)(i)"
rationale = "A few spellings (ought, augh, ough, silent b, g and t) cannot be worked out from sound. They are common in grade 3–4 reading, so children need them as known chunks rather than guesses."
teach = "Group words that share both sound and spelling: bought, brought, thought. For silent letters, show the related word where the letter is heard if there is one (sign/signal)."
watch_for = "Phonetic spellings (thot, cot for caught, lam, sine). Count them as pattern errors, not careless ones."

[[strand]]
id = "affix-3"
title = "Prefixes and suffixes (grade 3)"
track = "phonics"
grade = 3
teks = "§110.5(b)(2)(B)(iv)-(v); §110.5(b)(3)(C)"
rationale = "Third-grade TEKS name specific affixes (dis-, pre-, non-, im-/in-, -ness, -y, -ful). Each has a fixed spelling and a fixed meaning, so learning it once unlocks dozens of words."
teach = "Write the base word, then add the part: dis + like. Say what the new word means using the part's meaning (dislike = not like). When a suffix meets a final y or e, check the rule before joining."
watch_for = "Changing the base word when adding a prefix (dissappear). A prefix never changes the base word's letters: dis + appear has one s because appear has none."

[[strand]]
id = "homophones"
title = "Homophones"
track = "phonics"
grade = 3
teks = "§110.5(b)(2)(B)(ii); §110.6(b)(2)(B)(ii)"
rationale = "Homophones sound identical, so spelling by ear cannot work; the meaning decides. The TEKS list homophones in grade 3 and grade 4 spelling."
teach = "Always read the sentence. Ask which meaning fits, then write the spelling that goes with it. Tie a picture to one of the pair (a pear is a fruit; a pair is two)."
watch_for = "its/it's, your/you're and whose/who's. Test: can you say it is, you are or who is in that spot? If yes, use the apostrophe."

[[strand]]
id = "affix-4"
title = "Prefixes and suffixes (grade 4)"
track = "phonics"
grade = 4
teks = "§110.6(b)(2)(B)(iv)-(v); §110.6(b)(3)(C)"
rationale = "Grade 4 adds mis-, sub-, -ment, -able/-ible, -ity and -tion. Several of these change how the base word sounds (select, selection), which is exactly where spelling by ear breaks down."
teach = "Find the base word, write it, then add the suffix. Say the base word aloud even when the new word sounds different: select, selection."
watch_for = "-able vs -ible (they sound the same) and -shun written for -tion. Rule of thumb: -able usually follows a whole word you can see (wash-able); -ible usually follows a part that is not a word (vis-ible)."

[[strand]]
id = "roots"
title = "Greek and Latin roots"
track = "phonics"
grade = 4
teks = "§110.6(b)(3)(C); §110.7(b)(2)(B)(iv); §110.7(b)(3)(C)"
rationale = "Many long science and school words are built from a handful of Greek and Latin roots. A child who knows that graph means write and meter means measure can spell, and often guess the meaning of, words like thermometer on sight."
teach = "Underline the root, say what it means, and list other words that share it. Spell the root as one chunk, then add the rest."
watch_for = "Spelling the root by sound inside a long word (thermomiter, telafone). Remind the child the root is always spelled the same way."

[[strand]]
id = "affix-5"
title = "Prefixes and suffixes (grade 5)"
track = "phonics"
grade = 5
teks = "§110.7(b)(2)(B)(v); §110.7(b)(3)(C)"
rationale = "Grade 5 TEKS name trans-, super- and -ive (and -logy, taught with the roots). These carry much of the vocabulary in science and social studies."
teach = "Split the word into prefix, base and suffix, write each part, then join. Say the meaning of each part (trans = across, super = above or beyond)."
watch_for = "Keeping a silent e before -ive (createive). The e drops before a suffix that starts with a vowel."

[[strand]]
id = "changes"
title = "Sound changes between related words"
track = "phonics"
grade = 5
teks = "§110.7(b)(2)(B)(ii)-(iii)"
rationale = "When a suffix is added, the base word's sound can shift (decide, decision; music, musician; crime, criminal) while its spelling mostly stays. Grade 5 TEKS ask children to spell these consonant and vowel changes. The related shorter word is the best clue to the hard part."
teach = "Write the pair side by side: music / musician. Point to the letter that stays the same even though its sound changes."
watch_for = "Spelling the new sound (musishun, decizhun, crimminal). Ask: which word is this built from?"

# ---------------------------------------------------------------------------
# SKILLS
# ---------------------------------------------------------------------------
# --- vc ---

[[skill]]
id = "sp.vc"
strand = "vc"
hl = "^[aeiou]"
title = "VC words (at, up)"
pattern = '^[aeiou][bcdfghjklmnpqrstvwxyz]$'
tip = "Two sounds, two letters. Say the vowel first, then the last sound."
note = "is and as end in a /z/ sound but are spelled with s; they are kept as transfer words."
words = ["at","in","up","on","it","am","an","us","if","ox","ad","ax","is","as"]

# --- cvc ---

[[skill]]
id = "sp.cvc.a"
strand = "cvc"
hl = "a"
title = "Short a (cat, map)"
pattern = '^[bcdfghjklmnpqrstvwxyz]a[bcdfghjklmnpqrstvwxyz]$'
tip = "The sound /a/ as in cat is spelled with the letter a."
words = ["cat","bat","hat","mat","rat","sat","can","fan","man","pan","ran","van","bag","tag","nap","tap","cap","map","jam","ham","dad","bad","had","pad","sad","gap","lap"]

[[skill]]
id = "sp.cvc.e"
strand = "cvc"
hl = "e"
title = "Short e (bed, pen)"
prereqs = ["sp.cvc.a"]
pattern = '^[bcdfghjklmnpqrstvwxyz]e[bcdfghjklmnpqrstvwxyz]$'
tip = "The sound /e/ as in bed is spelled with the letter e."
words = ["bed","red","pen","ten","hen","men","net","pet","wet","jet","web","leg","beg","peg","get","let","set","den","wed","vet","yes"]

[[skill]]
id = "sp.cvc.i"
strand = "cvc"
hl = "i"
title = "Short i (pig, sit)"
prereqs = ["sp.cvc.e"]
pattern = '^[bcdfghjklmnpqrstvwxyz]i[bcdfghjklmnpqrstvwxyz]$'
tip = "The sound /i/ as in pig is spelled with the letter i."
words = ["pig","big","dig","wig","fin","pin","win","bin","sit","hit","bit","fit","lip","tip","zip","dip","kid","lid","did","rib","bib","six","mix","fix"]

[[skill]]
id = "sp.cvc.o"
strand = "cvc"
hl = "o"
title = "Short o (dog, hop)"
prereqs = ["sp.cvc.i"]
pattern = '^[bcdfghjklmnpqrstvwxyz]o[bcdfghjklmnpqrstvwxyz]$'
tip = "The sound /o/ as in dog is spelled with the letter o."
words = ["dog","log","fog","hog","hop","mop","top","pop","pot","hot","dot","cot","box","fox","rob","job","lot","not","nod","cob"]

[[skill]]
id = "sp.cvc.u"
strand = "cvc"
hl = "u"
title = "Short u (bug, sun)"
prereqs = ["sp.cvc.o"]
pattern = '^[bcdfghjklmnpqrstvwxyz]u[bcdfghjklmnpqrstvwxyz]$'
tip = "The sound /u/ as in bug is spelled with the letter u."
words = ["bug","hug","rug","mug","jug","sun","run","fun","bun","cup","pup","cut","nut","hut","bus","gum","sum","mud","bud","tub","rub"]

[[skill]]
id = "sp.cvc.mixed"
strand = "cvc"
hl = "[aeiou]"
title = "Mixed short vowels"
prereqs = ["sp.cvc.u"]
pattern = '^[bcdfghjklmnpqrstvwxyz][aeiou][bcdfghjklmnpqrstvwxyz]$'
tip = "Listen to the middle sound. Which vowel makes it?"
note = "Interleaves all five vowels so the child must choose the vowel by ear instead of by the day's lesson."
words = ["sit","hop","bed","cup","ran","big","dog","net","bus","map","pin","fox","red","mud","lap","ten","zip","hot","jam","leg","cut"]

[[skill]]
id = "sp.cvc.ccvc"
strand = "cvc"
hl = "^[bcdfghjklmnpqrstvwxyz]{2}"
title = "CCVC words (flop, spit)"
prereqs = ["sp.cvc.mixed"]
pattern = '^[bcdfghjklmnpqrstvwxyz]{2}[aeiou][bcdfghjklmnpqrstvwxyz]$'
tip = "Two sounds at the start. Say them both, then the vowel, then the end."
note = "TEKS kindergarten spelling includes CCVC words. The blend skills in grade 1 return to these by blend family."
words = ["flop","spit","drag","slap","trot","grub","plot","stun","slid","snag","brim","smug"]

# --- digraph ---

[[skill]]
id = "sp.digraph.sh"
strand = "digraph"
title = "sh (ship, fish)"
prereqs = ["sp.cvc.mixed"]
pattern = 'sh'
tip = "The sound /sh/ is spelled sh. Two letters, one sound."
words = ["ship","shop","shed","shut","shin","fish","dish","wish","rush","cash","bush","mash","dash","trash","flash"]

[[skill]]
id = "sp.digraph.ch"
strand = "digraph"
title = "ch (chip, much)"
prereqs = ["sp.digraph.sh"]
pattern = 'ch'
tip = "The sound /ch/ is spelled ch."
words = ["chat","chip","chop","chin","chest","much","such","rich","lunch","bench","punch","ranch","chill","chum"]

[[skill]]
id = "sp.digraph.th"
strand = "digraph"
title = "th (this, bath)"
prereqs = ["sp.digraph.ch"]
pattern = 'th'
tip = "The sound /th/ is spelled th. Put your tongue between your teeth."
words = ["that","this","them","then","thin","thick","bath","path","math","with","moth","thump","cloth","thank"]

[[skill]]
id = "sp.digraph.ck"
strand = "digraph"
title = "ck (back, duck)"
prereqs = ["sp.digraph.th"]
pattern = 'ck$'
tip = "At the end of a short word, the sound /k/ after a short vowel is spelled ck."
words = ["back","pack","sack","rock","sock","lock","duck","luck","neck","deck","kick","sick","pick","tick","black","clock","stick"]

[[skill]]
id = "sp.digraph.ng"
strand = "digraph"
title = "-ng (ring, song)"
prereqs = ["sp.digraph.ck"]
pattern = 'ng$'
tip = "The sound /ng/ at the end is spelled ng."
words = ["ring","sing","king","wing","song","long","hung","rung","sung","hang","bang","sang","gang","lung"]

[[skill]]
id = "sp.digraph.nk"
strand = "digraph"
title = "-nk (bank, sink)"
prereqs = ["sp.digraph.ng"]
pattern = 'nk$'
tip = "The sounds /ng/ + /k/ at the end are spelled nk."
words = ["bank","tank","sank","sink","pink","wink","junk","sunk","bunk","honk","drink","trunk","blank","plank"]

# --- blend ---

[[skill]]
id = "sp.blend.l"
strand = "blend"
title = "l-blends (clap, flag, slip)"
prereqs = ["sp.digraph.nk"]
pattern = '^(bl|cl|fl|gl|pl|sl)'
tip = "Say both sounds at the start: c-l, f-l, s-l."
words = ["clap","clip","club","flag","flap","flip","flat","glad","glum","plan","plug","plum","slam","sled","slip","slim","slug","blob","blot","clam","clan"]

[[skill]]
id = "sp.blend.r"
strand = "blend"
title = "r-blends (crab, trip)"
prereqs = ["sp.blend.l"]
pattern = '^(br|cr|dr|fr|gr|pr|tr)'
tip = "Say both sounds at the start: c-r, t-r, d-r."
words = ["brag","crab","crib","drip","drum","frog","grab","grin","grip","prop","trap","trip","trim","bred","crop","drop","fret"]

[[skill]]
id = "sp.blend.s"
strand = "blend"
title = "s-blends (stop, swim)"
prereqs = ["sp.blend.r"]
pattern = '^(st|sp|sk|sn|sm|sw|sc)'
tip = "Say both sounds at the start: s-t, s-p, s-w."
words = ["stop","step","stem","spin","spot","span","skip","skin","skid","snap","snip","snug","swim","swam","smog","stub","spud","scan"]

[[skill]]
id = "sp.blend.final.nd"
strand = "blend"
title = "Ending -nd (hand, sand)"
prereqs = ["sp.blend.s"]
pattern = 'nd$'
tip = "Listen for the n before the d. Do not skip it."
words = ["hand","sand","band","land","bend","send","lend","fund","fond","pond","mend","tend","blend","stand"]

[[skill]]
id = "sp.blend.final.nt"
strand = "blend"
title = "Ending -nt (tent, hunt)"
prereqs = ["sp.blend.final.nd"]
pattern = 'nt$'
tip = "Listen for the n before the t. Do not skip it."
words = ["tent","bent","went","sent","rent","hunt","ant","punt","dent","vent","hint","mint","lint","pant"]

[[skill]]
id = "sp.blend.final.mp"
strand = "blend"
title = "Ending -mp (lamp, jump)"
prereqs = ["sp.blend.final.nt"]
pattern = 'mp$'
tip = "Listen for the m before the p. Do not skip it."
words = ["lamp","camp","jump","bump","damp","lump","pump","romp","dump","hump","limp","stamp","clump","stump"]

[[skill]]
id = "sp.blend.final.st"
strand = "blend"
title = "Ending -st (fast, nest)"
prereqs = ["sp.blend.final.mp"]
pattern = 'st$'
tip = "Two sounds at the end: s and t."
words = ["fast","last","best","nest","rest","test","fist","list","mist","dust","must","just","cost","vest"]

[[skill]]
id = "sp.blend.final.ft"
strand = "blend"
title = "Endings -ft, -lt, -lf (lift, belt)"
prereqs = ["sp.blend.final.st"]
pattern = '(ft|lt|lf)$'
tip = "Two sounds at the end. Say them slowly and write both."
words = ["left","lift","gift","soft","raft","belt","melt","felt","gulf","self","loft","shift","swift","tilt"]

[[skill]]
id = "sp.blend.final.sk"
strand = "blend"
title = "Endings -sk, -sp (desk, wasp)"
prereqs = ["sp.blend.final.ft"]
pattern = '(sk|sp)$'
tip = "Two sounds at the end: s and k, or s and p."
words = ["desk","risk","task","mask","disk","husk","tusk","dusk","wasp","gasp","lisp","crisp","clasp","grasp"]

# --- silent-e ---

[[skill]]
id = "sp.silent-e.a"
strand = "silent-e"
title = "a-e (cake, make)"
prereqs = ["sp.blend.final.sk"]
pattern = 'a[^aeiou]e$'
tip = "The silent e at the end makes the a say its name: cap becomes cape."
words = ["cake","make","take","lake","same","game","name","came","late","gate","safe","wave","cave","face","race","page","bake","plane","flame","snake"]

[[skill]]
id = "sp.silent-e.i"
strand = "silent-e"
title = "i-e (bike, time)"
