# Math curriculum — Texas-aligned scope and sequence, kindergarten through grade 5 (draft v0.2)
#
# Each [[skill]] names a `generator` (see src/dq/generators.py) and its `params`, so the
# program can produce unlimited fresh problems. `demo` holds hand-written examples with
# answers for the adult reading the skill list.
#
# TEKS notes: the grade 3 fraction standards (111.5(b)(3)(A)-(H)) are quoted from TEA
# text I retrieved, and I know grade 3 includes "recall facts to multiply up to 10 by 10
# with automaticity and recall the corresponding division facts". The exact section
# numbering for the other items and the grade bands are my own mapping. Treat them as a
# starting point to check against the TEKS, not a citation.

[meta]
subject = "math"
version = "0.2"
teks_ref = "Mathematics §111.2 (kindergarten), §111.3 (grade 1), §111.4 (grade 2), §111.5 (grade 3), §111.6 (grade 4), §111.7 (grade 5)"
teks_numbering_verified = false

# ---------------------------------------------------------------------------
# STRANDS
# ---------------------------------------------------------------------------

[[strand]]
id = "number"
title = "Number sense and place value"
grade = 1
rationale = "Place value is the idea underneath every algorithm. A child who knows that 47 is 4 tens and 7 ones will understand regrouping; a child who does not will memorise carrying as a trick."
teach = "Use physical objects: ten-sticks and single cubes (or dimes and pennies). Build the number, then write it."
watch_for = "Reversed digits (writing 17 for 71) are very common at this age. Record them as 'reversal', not as a math error."

[[strand]]
id = "addsub"
title = "Addition and subtraction"
grade = 1
rationale = "Automatic recall of facts within 20 frees working memory for everything later. The sequence runs facts, then tens, then two-digit without regrouping, then with regrouping."
teach = "Make-ten and doubles first: they give children a strategy, not only memory. Use a ten-frame or fingers until the facts are automatic."
watch_for = "Counting on fingers is fine at first. It is a sign the fact is not automatic yet. Watch for subtracting the smaller digit from the larger in each column (52 - 28 = 36)."

[[strand]]
id = "multdiv"
title = "Multiplication and division"
grade = 2
rationale = "TEKS grade 3 expects automatic recall of the multiplication table to 10x10 and the matching division facts. Teaching division as the inverse of multiplication (3 x 4 = 12 so 12 / 3 = 4) halves the memorisation load."
teach = "Start with arrays: rows and columns of dots. Skip-count along the rows. Pair every multiplication fact with its division fact and its commuted fact."
watch_for = "Times tables are not equally hard. 6, 7, 8 and 9 take the longest. The scheduler will give them more slots on its own; no need to rush."

[[strand]]
id = "fractions"
title = "Fractions"
grade = 2
rationale = "TEKS grade 3 teaches fractions as numbers on a number line, not only slices of a pie: denominators 2, 3, 4, 6, 8, unit fractions, equivalence, and comparison by reasoning about size. Grade 4 adds adding and subtracting with like denominators."
teach = "Use strips of paper folded into equal parts, and a number line from 0 to 1. Always draw the whole first. Emphasise that parts must be EQUAL."
watch_for = "Children think a bigger denominator means a bigger fraction (1/8 > 1/4) because 8 is bigger than 4. Pictures fix this faster than rules."

[[strand]]
id = "word"
title = "Word problems"
grade = 1
rationale = "TEKS asks children to apply math in everyday situations. The hard part is choosing the operation from the story, not the arithmetic."
teach = "Read the problem twice. Ask: is something joining, leaving, or being compared? Draw a quick picture."
watch_for = "Children who add every pair of numbers they see. Ask them to say what the answer will measure."

[[strand]]
id = "counting"
title = "Counting and numbers to 20"
grade = 0
teks = "§111.2(b)(2)-(3)"
rationale = "Kindergarten math is counting: saying the number words in order, matching one word to one object, knowing the last number said is how many, and seeing that one more makes the next number. Everything in first grade rests on these."
teach = "Count real things: spoons, steps, toys. Touch each one as you say its number. Ask 'how many?' after counting so the child says the last number again."
watch_for = "Skipping or double-counting an object, and teen numbers (writing 31 for 13). Count slowly with a finger on each dot."

[[strand]]
id = "place"
title = "Place value, rounding and large numbers"
grade = 3
teks = "§111.5(b)(2), §111.6(b)(2), §111.7(b)(2)"
rationale = "Grades 3 to 5 stretch place value to the millions and then down to thousandths. Rounding is place value used for estimating: 'about how much?' before working it out."
teach = "Write the number in a place-value chart (thousands, hundreds, tens, ones). For rounding, find the two tens (or hundreds) it sits between and ask which is closer."
watch_for = "Reading 40,506 as 4,056 (losing the zeros). For rounding, a 5 in the next place rounds up."

[[strand]]
id = "measure"
title = "Money, area, perimeter and volume"
grade = 2
teks = "§111.4(b)(5), §111.5(b)(6)-(7), §111.6(b)(5), §111.7(b)(4)"
rationale = "Coins come first (grade 2), then perimeter and area of rectangles (grades 3 and 4), then volume of boxes (grade 5). Each one is multiplication or addition with a picture behind it."
teach = "Sketch the rectangle and label its sides. Perimeter walks around the edge (add all four sides); area fills the inside (rows times columns). Volume stacks layers of area."
watch_for = "Mixing up area and perimeter. Ask: are we going around it, or covering it?"

[[strand]]
id = "decimals"
title = "Decimals"
grade = 4
teks = "§111.6(b)(2)(E)-(G), §111.7(b)(2)-(3)"
rationale = "Decimals are fractions with 10, 100 or 1000 on the bottom. Grade 4 reads, writes and compares tenths and hundredths; grade 5 rounds, adds, subtracts, multiplies and divides them."
teach = "Use money: 0.35 is 35 cents of a dollar. Line up the decimal points when adding or comparing, and fill empty places with zeros (0.5 = 0.50)."
watch_for = "Thinking 0.45 is bigger than 0.5 because 45 is bigger than 5. Write 0.5 as 0.50 and compare again."

[[strand]]
id = "expressions"
title = "Expressions and order of operations"
grade = 5
teks = "§111.7(b)(4)(E)-(F)"
rationale = "Grade 5 asks children to simplify expressions with more than one operation, which needs an agreed order: brackets, then multiply and divide, then add and subtract."
teach = "Underline the part to do first, work it out, rewrite the shorter expression, repeat."
watch_for = "Working left to right regardless of the operation (3 + 4 × 2 = 14)."

# ---------------------------------------------------------------------------
# SKILLS — kindergarten counting
# ---------------------------------------------------------------------------

[[skill]]
id = "m.k.count-10"
strand = "counting"
title = "Count dots to 10"
grade = 0
teks = "§111.2(b)(2)(C)"
generator = "count_dots"
params = { count = [1, 10] }
min_distinct = 8
tip = "Touch each dot once and say the next number. The last number is how many."
demo = [{ q = "● ● ● ● ●  ● ●", a = "7" }]

[[skill]]
id = "m.k.after-10"
strand = "counting"
title = "What comes after (to 10)"
grade = 0
teks = "§111.2(b)(2)(A)"
generator = "neighbor"
params = { range = [0, 10], mode = "after" }
min_distinct = 8
prereqs = ["m.k.count-10"]
tip = "Count up to the number, then say one more."
demo = [{ q = "Just after 6", a = "7" }]

[[skill]]
id = "m.k.compare-10"
strand = "counting"
title = "Compare numbers to 10"
grade = 0
teks = "§111.2(b)(2)(G)"
generator = "compare"
params = { range = [0, 10], allow_equal = false }
prereqs = ["m.k.after-10"]
tip = "The number you say later when you count is bigger."
demo = [{ q = "3 ? 8", a = "<" }]

[[skill]]
id = "m.k.count-20"
strand = "counting"
title = "Count dots to 20"
grade = 0
teks = "§111.2(b)(2)(C)"
generator = "count_dots"
params = { count = [8, 20] }
min_distinct = 10
prereqs = ["m.k.count-10"]
tip = "Count each row of five: 5, 10, 15, then count on by ones."
demo = [{ q = "three rows of five and 2 more", a = "17" }]

[[skill]]
id = "m.k.before-after-20"
strand = "counting"
title = "Before and after (to 20)"
grade = 0
teks = "§111.2(b)(2)(F)"
generator = "neighbor"
params = { range = [0, 20], mode = "mix" }
prereqs = ["m.k.after-10", "m.k.count-20"]
tip = "After is one more. Before is one less."
demo = [{ q = "Just before 14", a = "13" }, { q = "Just after 19", a = "20" }]

[[skill]]
id = "m.k.count-on-100"
strand = "counting"
title = "Count by ones to 100"
grade = 0
teks = "§111.2(b)(2)(A)"
generator = "skip_count"
params = { steps = [1], start_max = 94, length = 5 }
prereqs = ["m.k.before-after-20"]
tip = "After 9 ones comes a new ten: 38, 39, 40."
demo = [{ q = "46, 47, ?, 49, 50", a = "48" }]

[[skill]]
id = "m.k.add-5"
strand = "counting"
title = "Add within 5"
grade = 0
teks = "§111.2(b)(3)(A)"
generator = "add"
params = { a = [0, 5], b = [0, 5], max_sum = 5 }
prereqs = ["m.k.count-10"]
tip = "Hold up fingers for each number, then count them all."
demo = [{ q = "2 + 3", a = "5" }]

[[skill]]
id = "m.k.sub-5"
strand = "counting"
title = "Take away within 5"
grade = 0
teks = "§111.2(b)(3)(A)"
generator = "sub"
params = { a = [1, 5], b = [0, 5] }
prereqs = ["m.k.add-5"]
tip = "Hold up the first number of fingers, put some down, count what is left."
demo = [{ q = "5 - 2", a = "3" }]

[[skill]]
id = "m.k.make-5"
strand = "counting"
title = "Ways to make 5"
grade = 0
teks = "§111.2(b)(2)(I)"
generator = "missing_addend"
params = { total = [5, 5], addend = [1, 4] }
min_distinct = 5
prereqs = ["m.k.add-5"]
tip = "Five fingers on one hand: some up, the rest down. Up and down make 5."
demo = [{ q = "3 + ? = 5", a = "2" }]

# ---------------------------------------------------------------------------
# SKILLS — number sense
# ---------------------------------------------------------------------------

[[skill]]
id = "m.num.skip-count"
strand = "number"
title = "Skip counting by 2, 5 and 10"
grade = 1
generator = "skip_count"
params = { steps = [2, 5, 10], start_max = 20, length = 6 }
tip = "Count by jumps. 2, 4, 6, 8: each number is 2 more."
demo = [{ q = "5, 10, 15, ?, 25", a = "20" }, { q = "2, 4, ?, 8, 10", a = "6" }]

[[skill]]
id = "m.num.tens-ones"
strand = "number"
title = "Tens and ones (to 99)"
grade = 1
generator = "place_value"
params = { mode = "compose", digits = 2 }
prereqs = ["m.num.skip-count"]
tip = "Each ten-stick is 10. Count the sticks by tens, then add the ones."
note = "Mixes composing (3 tens and 4 ones) with reading (how many tens in 47?)."
demo = [{ q = "3 tens and 4 ones", a = "34" }, { q = "How many tens in 58?", a = "5" }]

[[skill]]
id = "m.num.compare-100"
strand = "number"
title = "Compare numbers to 100"
grade = 1
generator = "compare"
params = { range = [0, 100], allow_equal = false }
prereqs = ["m.num.tens-ones"]
tip = "The alligator eats the bigger number. Look at the tens first."
note = "The < and > signs are a known stumbling block: children mirror them often. If the child consistently reverses, check the sign first before concluding they don't know which number is bigger."
demo = [{ q = "34 ? 43", a = "<" }, { q = "81 ? 18", a = ">" }]

# ---------------------------------------------------------------------------
# SKILLS — add and subtract
# ---------------------------------------------------------------------------

[[skill]]
id = "m.add.within-10"
strand = "addsub"
title = "Add within 10"
grade = 1
generator = "add"
params = { a = [0, 10], b = [0, 10], max_sum = 10 }
tip = "Start at the bigger number and count up."
demo = [{ q = "3 + 4", a = "7" }, { q = "6 + 2", a = "8" }]

[[skill]]
id = "m.sub.within-10"
strand = "addsub"
title = "Subtract within 10"
grade = 1
generator = "sub"
params = { a = [1, 10], b = [0, 10] }
prereqs = ["m.add.within-10"]
tip = "Start with the big number and take some away."
demo = [{ q = "9 - 4", a = "5" }, { q = "7 - 7", a = "0" }]

[[skill]]
id = "m.add.make-10"
strand = "addsub"
title = "Make ten"
grade = 1
generator = "missing_addend"
params = { total = [10, 10], addend = [1, 9] }
prereqs = ["m.add.within-10"]
tip = "Which number goes with 7 to make 10?"
note = "The most useful single fact family in early math. It is the foundation for adding across a ten (8 + 5 = 8 + 2 + 3)."
demo = [{ q = "7 + ? = 10", a = "3" }, { q = "? + 4 = 10", a = "6" }]

[[skill]]
id = "m.add.doubles"
strand = "addsub"
title = "Doubles (up to 10 + 10)"
grade = 1
generator = "add"
params = { a = [1, 10], b = [1, 10], equal = true }
prereqs = ["m.add.within-10"]
tip = "A double is a number plus itself. 6 + 6 = 12."
demo = [{ q = "6 + 6", a = "12" }, { q = "9 + 9", a = "18" }]

[[skill]]
id = "m.add.within-20"
strand = "addsub"
title = "Add across ten (sums 11 to 20)"
grade = 1
generator = "add"
params = { a = [2, 10], b = [2, 10], min_sum = 11, max_sum = 20 }
prereqs = ["m.add.make-10", "m.add.doubles"]
tip = "Make a ten first. For 8 + 5: 8 + 2 = 10, then 10 + 3 = 13."
demo = [{ q = "8 + 5", a = "13" }, { q = "7 + 9", a = "16" }]

[[skill]]
id = "m.sub.within-20"
strand = "addsub"
title = "Subtract within 20"
grade = 1
generator = "sub"
params = { a = [11, 20], b = [2, 10] }
prereqs = ["m.add.within-20", "m.sub.within-10"]
tip = "Think of a missing addend. 13 - 5 asks: 5 + ? = 13."
demo = [{ q = "13 - 5", a = "8" }, { q = "16 - 9", a = "7" }]

[[skill]]
id = "m.add.missing-addend-20"
strand = "addsub"
title = "Missing number (to 20)"
grade = 1
generator = "missing_addend"
params = { total = [6, 20], addend = [1, 12] }
prereqs = ["m.sub.within-20"]
tip = "A box hides one number. What goes in the box to make the sum true?"
demo = [{ q = "9 + ? = 15", a = "6" }, { q = "? + 8 = 14", a = "6" }]

[[skill]]
id = "m.add.tens"
strand = "addsub"
title = "Add tens (30 + 40)"
grade = 1
generator = "add"
params = { a = [10, 90], b = [10, 90], max_sum = 100, multiple_of = 10 }
prereqs = ["m.num.tens-ones", "m.add.within-10"]
tip = "Count the tens, like adding 3 + 4, then say 'tens'."
demo = [{ q = "30 + 40", a = "70" }, { q = "20 + 60", a = "80" }]

[[skill]]
id = "m.add.2d-1d"
strand = "addsub"
title = "Add 2-digit and 1-digit (no regrouping)"
grade = 1
generator = "add"
params = { a = [11, 98], b = [1, 8], max_sum = 99, regroup = "none" }
prereqs = ["m.add.tens"]
tip = "Add the ones, keep the tens. 23 + 4: 3 + 4 = 7, so 27."
demo = [{ q = "23 + 4", a = "27" }, { q = "52 + 6", a = "58" }]

[[skill]]
id = "m.add.2d-2d-none"
strand = "addsub"
title = "Add 2-digit numbers (no regrouping)"
grade = 2
generator = "add"
params = { a = [11, 89], b = [11, 88], max_sum = 99, regroup = "none" }
prereqs = ["m.add.2d-1d"]
tip = "Add ones with ones and tens with tens."
demo = [{ q = "23 + 45", a = "68" }, { q = "31 + 26", a = "57" }]

[[skill]]
id = "m.add.2d-1d-regroup"
strand = "addsub"
title = "Add 2-digit and 1-digit (regrouping)"
grade = 2
generator = "add"
params = { a = [11, 98], b = [2, 9], max_sum = 99, regroup = "yes" }
prereqs = ["m.add.2d-2d-none", "m.add.within-20"]
tip = "When the ones make 10 or more, trade 10 ones for 1 ten."
demo = [{ q = "38 + 7", a = "45" }, { q = "26 + 9", a = "35" }]

[[skill]]
id = "m.add.2d-2d-regroup"
strand = "addsub"
title = "Add 2-digit numbers (regrouping)"
grade = 2
generator = "add"
params = { a = [12, 89], b = [12, 87], max_sum = 99, regroup = "yes" }
prereqs = ["m.add.2d-1d-regroup"]
tip = "Add the ones. If it makes ten or more, carry a ten."
demo = [{ q = "38 + 27", a = "65" }, { q = "46 + 35", a = "81" }]

[[skill]]
id = "m.sub.tens"
strand = "addsub"
title = "Subtract tens (70 - 30)"
grade = 1
generator = "sub"
params = { a = [20, 100], b = [10, 90], multiple_of = 10 }
prereqs = ["m.add.tens", "m.sub.within-10"]
tip = "Subtract the tens like 7 - 3, then say 'tens'."
demo = [{ q = "70 - 30", a = "40" }, { q = "90 - 50", a = "40" }]

[[skill]]
id = "m.sub.2d-1d-none"
strand = "addsub"
title = "Subtract 1-digit from 2-digit (no regrouping)"
grade = 2
generator = "sub"
params = { a = [11, 99], b = [1, 8], regroup = "none" }
prereqs = ["m.sub.tens", "m.sub.within-20"]
tip = "Take the ones away from the ones."
demo = [{ q = "37 - 5", a = "32" }, { q = "68 - 3", a = "65" }]

[[skill]]
id = "m.sub.2d-2d-none"
strand = "addsub"
title = "Subtract 2-digit numbers (no regrouping)"
grade = 2
generator = "sub"
params = { a = [21, 99], b = [11, 88], regroup = "none" }
prereqs = ["m.sub.2d-1d-none"]
tip = "Subtract ones from ones and tens from tens."
demo = [{ q = "68 - 25", a = "43" }, { q = "97 - 34", a = "63" }]

[[skill]]
id = "m.sub.2d-regroup"
strand = "addsub"
title = "Subtract 2-digit numbers (regrouping)"
grade = 2
generator = "sub"
params = { a = [21, 99], b = [11, 88], regroup = "yes" }
prereqs = ["m.sub.2d-2d-none", "m.add.2d-2d-regroup"]
tip = "Not enough ones? Trade 1 ten for 10 ones."
note = "The hardest skill in this strand. Do it with physical tens and ones until the trade is obvious."
demo = [{ q = "52 - 28", a = "24" }, { q = "71 - 36", a = "35" }]

[[skill]]
id = "m.num.place-value-1000"
strand = "number"
title = "Hundreds, tens and ones"
grade = 2
generator = "place_value"
params = { mode = "compose", digits = 3 }
prereqs = ["m.num.tens-ones"]
tip = "100 is ten tens. 3 hundreds, 4 tens and 5 ones is 345."
demo = [{ q = "2 hundreds, 5 tens, 7 ones", a = "257" }, { q = "How many hundreds in 614?", a = "6" }]

[[skill]]
id = "m.num.compare-1000"
strand = "number"
title = "Compare numbers to 1000"
grade = 2
generator = "compare"
params = { range = [100, 999], allow_equal = false }
prereqs = ["m.num.place-value-1000", "m.num.compare-100"]
tip = "Compare hundreds first, then tens, then ones."
demo = [{ q = "354 ? 345", a = ">" }, { q = "212 ? 221", a = "<" }]

[[skill]]
id = "m.add.3d"
strand = "addsub"
title = "Add 3-digit numbers"
grade = 2
generator = "add"
params = { a = [100, 699], b = [100, 299], max_sum = 999 }
prereqs = ["m.add.2d-2d-regroup", "m.num.place-value-1000"]
tip = "Start with the ones, then tens, then hundreds."
demo = [{ q = "243 + 135", a = "378" }, { q = "457 + 286", a = "743" }]

[[skill]]
id = "m.sub.3d"
strand = "addsub"
title = "Subtract 3-digit numbers"
grade = 2
generator = "sub"
params = { a = [200, 999], b = [100, 599] }
prereqs = ["m.sub.2d-regroup", "m.add.3d"]
tip = "Start with the ones. Trade from the next column when you need to."
demo = [{ q = "568 - 243", a = "325" }, { q = "703 - 258", a = "445" }]

