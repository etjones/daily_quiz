# Analogies: a is to b as c is to ___. The child writes the missing word.
# answer  the expected word; accept  other answers that are also right (graded as right).
# relation  how a and b are linked, in plain words: shown to the grown-up and given to the
#           answer checker, which judges answers that are not listed.
# level  1 = everyday pairs, 2 = takes a moment, 3 = abstract or less common words.

