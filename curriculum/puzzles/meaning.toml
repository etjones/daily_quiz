# Word meanings: the child reads the prompt and writes one of the choices.
# prompt   what the child reads; the choices are shown after it in brackets.
# choices  three short options (one or two words each); answer must be one of them.
# skill    the vocabulary skill being practiced, in plain words for the grown-up.
# level    1-5, roughly the school grade (TEKS vocabulary):
#          1 = everyday synonyms and opposites
#          2 = un-, re-, -ful, -less, -er, -est and more synonyms and opposites
#          3 = dis-, pre-, non-, im-/in-, -ness, -y, context clues, multiple meanings
#          4 = mis-, sub-, -ment, -able/-ible, -ity, roots auto graph meter tele phon port bio
#          5 = trans-, super-, -ive, -logy, roots geo photo struct rupt dict spect aqua

