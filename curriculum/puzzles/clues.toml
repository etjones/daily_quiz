# Clue puzzles: the child reads the clue and writes the word, so a spelling word is pulled
# up from its meaning instead of heard. Every key must be a word in spelling.toml; when the
# child writes the word (even misspelled) the answer is graded as a spelling test of it.
# Keep clues short and pointing at one word; the quiz also shows the number of letters.

