{% extends "house_style.html" %}
{% block title %}Sign in · dq{% endblock %}
{% block content %}
<header class="masthead">
  <p class="kicker">dq</p>
  <h1>Sign in</h1>
</header>
<main>
  {% if form.errors %}<div class="callout"><p>That username and password didn't match.</p></div>{% endif %}
  <form method="post" action="/login">
    {{ csrf_input }}
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <p>
      <label class="field" for="id_username">Username</label>
      <input type="text" id="id_username" name="username" autocomplete="username" autofocus required>
    </p>
    <p>
      <label class="field" for="id_password">Password</label>
      <input type="password" id="id_password" name="password" autocomplete="current-password" required>
    </p>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p>You stay signed in on this device for 30 days after your last visit.</p>
</main>
{% endblock %}
