[project]
name = "dq"
version = "0.1.0"
description = "Adaptive daily quiz and worksheet system for home education"
requires-python = ">=3.11"
dependencies = [
    "typst>=0.11",
    "opencv-python-headless>=4.8",
    "numpy",
    "pillow",
    "pypdf",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "routinely>=0.3.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1",
    "pytest",
]

[project.scripts]
dq = "dq.cli:main"

# Long-running web service (routinely keeps it alive with systemd). Reads PORT from .env (assigned by
# deploy-site) and binds 127.0.0.1 only; Caddy terminates TLS at quizzes.dayonetools.com.
[tool.routinely.dq-web]
command     = "uv run --no-dev python -m dq.web"
schedule    = "always"
label       = "com.evanjones.dq-web"
environment = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:~/.local/bin" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dq.web" = ["templates/*.html", "static/house-style/*", "static/house-style/themes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
