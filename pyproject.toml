[project]
name = "dq"
version = "0.1.0"
description = "Adaptive daily quiz and worksheet system for home education"
requires-python = ">=3.11"
dependencies = [
    "typst>=0.11",
    "opencv-python-headless>=4.8",
    "numpy",
    "pillow",
    "pypdf",
    "jinja2>=3.1.6",
    "routinely>=0.3.0",
    "python-dotenv>=1.2.4",
    "django[argon2]>=5.2.18",
    "whitenoise>=6.12.0",
    "gunicorn>=26.2.0",
]

[project.scripts]
dq = "dq.cli:main"

# Long-running web service (routinely keeps it alive with systemd). Applies migrations, then runs
# gunicorn on 127.0.0.1:$PORT (PORT assigned in .env by deploy-site); Caddy terminates TLS at
# quizzes.dayonetools.com. DJANGO_SECRET_KEY is an op:// reference resolved by `op run`.
[tool.routinely.dq-web]
command          = "uv run --no-dev python -m dq.web"
schedule         = "always"
label            = "com.evanjones.dq-web"
environment      = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:~/.local/bin" }
wrapper          = "op run --env-file=.env --"
environment_file = "~/.config/op/token.env"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dq.web" = ["templates/*.html", "static/house-style/*", "static/house-style/themes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
DJANGO_SETTINGS_MODULE = "django_settings"
